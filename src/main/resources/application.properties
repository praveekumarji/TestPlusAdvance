# Spring Boot Application Properties

# Server Configuration

spring.profiles.active=${ENV:dev}
spring.threads.virtual.enabled=true
# Spring Boot Application Properties

# Server Configuration
server.port=8081

# Actuator monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=false
info.app.name=TestPulse
info.app.version=0.0.1

# Logging Configuration
logging.level.com.testpulse=INFO
logging.level.com.testpulse.service.impl.QuestionServiceImpl=DEBUG
logging.file.name=logs/testpulse.log

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/userdb
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Initialization
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data.sql

# Liquibase Configuration
spring.liquibase.enabled=false

# Sunday Mega test generation defaults
mega-test.subject=${MEGA_TEST_SUBJECT:English}
mega-test.question-count=${MEGA_TEST_QUESTION_COUNT:10}
mega-test.difficulty=${MEGA_TEST_DIFFICULTY:MEDIUM}
mega-test.mode=${MEGA_TEST_MODE:EXAM}
mega-test.lang=${MEGA_TEST_LANG:en}
mega-test.time-zone=${MEGA_TEST_TIME_ZONE:Asia/Kolkata}
mega-test.leaderboard-limit=${MEGA_TEST_LEADERBOARD_LIMIT:5}

# JWT Configuration
jwt.secret=${JWT_SECRET:sRg5ohVcFGa+Ea6vl8fSQO5KrVYcb3cqT3C/J8Qzvas=}
jwt.expiration=3600000
subscription.trial-days=${SUBSCRIPTION_TRIAL_DAYS:3}
 
# Google Play Billing verification. Keep the private key outside source control.
google.play.package-name=${GOOGLE_PLAY_PACKAGE_NAME:}
google.play.service-account-email=${GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL:}
google.play.service-account-private-key=${GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY:}

# SMTP configuration. Set TESTPULSE_MAIL_PASSWORD outside source control.
spring.mail.host=${TESTPULSE_MAIL_HOST:mail.rctechn.com}
spring.mail.port=${TESTPULSE_MAIL_PORT:465}
spring.mail.username=${TESTPULSE_MAIL_USERNAME:testplus@rctechn.com}
spring.mail.password=${TESTPULSE_MAIL_PASSWORD:test@2026#}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# Cache Configuration
# Cache type: simple (ConcurrentHashMap), caffeine, redis, etc.
spring.cache.type=caffeine

# Cache names to enable
spring.cache.cache-names=users,tests,questions,shortQa,shortQaQuestions,subscriptionPlans,educationClasses,coupons,bookmarks,appConfig,testAttempts

